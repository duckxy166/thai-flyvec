<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1324" viewBox="0 0 1600 1324" role="img" aria-labelledby="t d">
<title id="t">เทียบขั้นตอนการทำงานของ FlyVec ต้นฉบับกับ FlyVec ภาษาไทย</title>
<desc id="d">สองเลนขนานกัน ซ้ายคือ FlyVec ต้นฉบับของ Liang et al. (2021) บนภาษาอังกฤษ ขวาคือ pipeline ภาษาไทยของโครงงานนี้ แถวสีเหลืองคือขั้นตอนที่ปรับสำหรับภาษาไทย แถวสีเทาคือขั้นตอนที่เหมือนงานต้นฉบับ</desc>
<style><![CDATA[@import url("https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Sriracha&display=swap");text{font-family:'Mali','Noto Sans Thai',Tahoma,sans-serif}]]></style>
